<form class="dwauto-healing-moves">
  <p class="notes">{{hint}}</p>

  <table class="dwauto-attack-moves-table">
    <thead>
      <tr>
        <th>{{localize "DWAUTO.HealingMoves.Name"}}</th>
        <th>{{localize "DWAUTO.HealingMoves.FormulaMode"}}</th>
        <th>{{localize "DWAUTO.HealingMoves.CustomFormula"}}</th>
        <th>{{localize "DWAUTO.HealingMoves.TransferToSelfOnPartial"}}</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td><input type="text" name="rows.{{@index}}.name" value="{{this.name}}"></td>
        <td>
          <select name="rows.{{@index}}.formulaMode">
            {{#each this.modeOptions}}
            <option value="{{this.value}}" {{#if this.selected}}selected{{/if}}>{{this.label}}</option>
            {{/each}}
          </select>
        </td>
        <td><input type="text" name="rows.{{@index}}.customFormula" value="{{this.customFormula}}" placeholder="1d8"></td>
        <td><input type="checkbox" name="rows.{{@index}}.transferToSelfOnPartial" {{checked this.transferToSelfOnPartial}}></td>
        <td><button type="button" class="dwauto-remove-row" data-action="remove-row" data-index="{{@index}}"><i class="fas fa-trash"></i></button></td>
      </tr>
      {{/each}}
    </tbody>
  </table>

  <button type="button" data-action="add-row"><i class="fas fa-plus"></i> {{localize "DWAUTO.AttackMoves.AddRow"}}</button>
  <button type="button" data-action="reset-defaults"><i class="fas fa-rotate-left"></i> {{localize "DWAUTO.HealingMoves.ResetDefaultsButton"}}</button>

  <footer class="sheet-footer flexrow">
    <button type="submit"><i class="fas fa-save"></i> {{localize "SETTINGS.Save"}}</button>
  </footer>
</form>

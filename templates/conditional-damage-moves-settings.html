<form class="dwauto-conditional-damage-moves">
  <p class="notes">{{hint}}</p>

  <table class="dwauto-attack-moves-table">
    <thead>
      <tr>
        <th>{{localize "DWAUTO.ConditionalDamageMoves.Name"}}</th>
        <th>{{localize "DWAUTO.ConditionalDamageMoves.YesFormula"}}</th>
        <th>{{localize "DWAUTO.ConditionalDamageMoves.NoFormula"}}</th>
        <th>{{localize "DWAUTO.ConditionalDamageMoves.RequiresDesignation"}}</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td><input type="text" name="rows.{{@index}}.name" value="{{this.name}}"></td>
        <td><input type="text" name="rows.{{@index}}.yesFormula" value="{{this.yesFormula}}" placeholder="1d4"></td>
        <td><input type="text" name="rows.{{@index}}.noFormula" value="{{this.noFormula}}" placeholder="0"></td>
        <td><input type="checkbox" name="rows.{{@index}}.requiresDesignation" {{checked this.requiresDesignation}}></td>
        <td><button type="button" class="dwauto-remove-row" data-action="remove-row" data-index="{{@index}}"><i class="fas fa-trash"></i></button></td>
      </tr>
      {{/each}}
    </tbody>
  </table>

  <button type="button" data-action="add-row"><i class="fas fa-plus"></i> {{localize "DWAUTO.AttackMoves.AddRow"}}</button>
  <button type="button" data-action="reset-defaults"><i class="fas fa-rotate-left"></i> {{localize "DWAUTO.ConditionalDamageMoves.ResetDefaultsButton"}}</button>

  <footer class="sheet-footer flexrow">
    <button type="submit"><i class="fas fa-save"></i> {{localize "SETTINGS.Save"}}</button>
  </footer>
</form>

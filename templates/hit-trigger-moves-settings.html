<form class="dwauto-hit-trigger-moves">
  <p class="notes">{{hint}}</p>

  <table class="dwauto-attack-moves-table">
    <thead>
      <tr>
        <th>{{localize "DWAUTO.HitTriggerMoves.Name"}}</th>
        <th>{{localize "DWAUTO.HitTriggerMoves.Effect"}}</th>
        <th>{{localize "DWAUTO.HitTriggerMoves.GrantsForward"}}</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td><input type="text" name="rows.{{@index}}.name" value="{{this.name}}"></td>
        <td>
          <select name="rows.{{@index}}.effect">
            {{#each this.effectOptions}}
            <option value="{{this.value}}" {{#if this.selected}}selected{{/if}}>{{this.label}}</option>
            {{/each}}
          </select>
        </td>
        <td><input type="checkbox" name="rows.{{@index}}.grantsForward" {{checked this.grantsForward}}></td>
        <td><button type="button" class="dwauto-remove-row" data-action="remove-row" data-index="{{@index}}"><i class="fas fa-trash"></i></button></td>
      </tr>
      {{/each}}
    </tbody>
  </table>

  <button type="button" data-action="add-row"><i class="fas fa-plus"></i> {{localize "DWAUTO.AttackMoves.AddRow"}}</button>
  <button type="button" data-action="reset-defaults"><i class="fas fa-rotate-left"></i> {{localize "DWAUTO.HitTriggerMoves.ResetDefaultsButton"}}</button>

  <footer class="sheet-footer flexrow">
    <button type="submit"><i class="fas fa-save"></i> {{localize "SETTINGS.Save"}}</button>
  </footer>
</form>
